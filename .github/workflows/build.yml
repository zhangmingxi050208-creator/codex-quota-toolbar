name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build toolbar and installer
        shell: powershell
        run: .\build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaToolbar-Windows
          path: dist/
          if-no-files-found: error

